name: BadmintonVAR
options:
  bundleIdPrefix: com.badmintonvar
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
targets:
  BadmintonVAR:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BadmintonVAR
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: "BadmintonVAR"
        PRODUCT_BUNDLE_IDENTIFIER: com.badmintonvar.app
        INFOPLIST_FILE: BadmintonVAR/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

name: Build iOS BadmintonVAR (IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA with XcodeGen
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App (Release Unsigned)
        run: |
          set +e
          xcodebuild build \
            -project BadmintonVAR.xcodeproj \
            -scheme BadmintonVAR \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE="Manual" > build.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "### Build Failed with code $STATUS" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build.log
            exit $STATUS
          fi

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/BadmintonVAR.app Payload/
          zip -r BadmintonVAR.ipa Payload
          echo "IPA packaging completed successfully."

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BadmintonVAR-iPhone
          path: BadmintonVAR.ipa
          retention-days: 14
